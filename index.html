<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mansonry Family | Private Member Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      color: #222;
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand h2 {
      margin: 0;
      font-size: 20px;
    }

    .brand span {
      font-size: 13px;
      opacity: .8;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    h3 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 15px;
    }

    .primary {
      background: #111827;
      color: white;
      width: 100%;
      margin-top: 8px;
    }

    .logout {
      background: #374151;
      color: white;
    }

    .hidden {
      display: none;
    }

    #messages {
      height: 420px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      background: #f9fafb;
      margin-bottom: 12px;
    }

    .message {
      max-width: 80%;
      padding: 10px 13px;
      margin: 8px 0;
      border-radius: 12px;
      word-wrap: break-word;
    }

    .mine {
      margin-left: auto;
      background: #dbeafe;
    }

    .admin {
      margin-right: auto;
      background: #e5e7eb;
    }

    .time {
      display: block;
      font-size: 10px;
      opacity: .6;
      margin-top: 4px;
    }

    .send-row {
      display: flex;
      gap: 8px;
    }

    .send-row input {
      margin: 0;
      flex: 1;
    }

    .send-row button {
      background: #111827;
      color: white;
    }

    .status {
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
      background: #f3f4f6;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }
  </style>
</head>

<body>

<header class="header">
  <div class="brand">
    <h2>MANSONRY FAMILY</h2>
    <span>Private Member Chat</span>
  </div>

  <button id="logoutBtn" class="logout hidden">Logout</button>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="loginCard" class="card">
    <h3>Member Login</h3>

    <p>Sign in to your private member chat.</p>

    <div id="loginStatus" class="status hidden"></div>

    <input
      id="email"
      type="email"
      placeholder="Email address"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginBtn" class="primary">
      Sign In
    </button>
  </div>

  <!-- CHAT -->
  <div id="chatCard" class="card hidden">

    <h3 id="welcome"></h3>

    <div id="chatStatus" class="status">
      Private conversation with Mansonry Family Administrator
    </div>

    <div id="messages"></div>

    <div class="send-row">
      <input
        id="messageInput"
        type="text"
        maxlength="4000"
        placeholder="Write your message..."
      >

      <button id="sendBtn">Send</button>
    </div>

  </div>

</div>

<script>alert("TEST WORKS");</script>
<script>
  alert("JavaScript is running");
  // ================================
  // SUPABASE CONFIGURATION
  // ================================

  const SUPABASE_URL = "https://rsinxyyxjyasapophbgv.supabase.co

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_7hjRDSl_WCP28nPoTWm5tg_1Qjn0cXa";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  // ================================
  // PAGE ELEMENTS
  // ================================

  const loginCard = document.getElementById("loginCard");
  const chatCard = document.getElementById("chatCard");
  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");

  const loginStatus = document.getElementById("loginStatus");
  const chatStatus = document.getElementById("chatStatus");

  const welcome = document.getElementById("welcome");
  const messagesBox = document.getElementById("messages");

  const messageInput = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");


  let currentUser = null;
  let currentProfile = null;
  let currentConversation = null;
  let realtimeChannel = null;


  // ================================
  // STATUS MESSAGE
  // ================================

  function showStatus(element, message, type = "") {
    element.textContent = message;
    element.className = "status " + type;
    element.classList.remove("hidden");
  }


  // ================================
  // LOGIN
  // ================================

  loginBtn.addEventListener("click", async () => {

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
      showStatus(
        loginStatus,
        "Please enter your email and password.",
        "error"
      );
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Signing in...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    loginBtn.disabled = false;
    loginBtn.textContent = "Sign In";

    if (error) {
      showStatus(
        loginStatus,
        error.message,
        "error"
      );
      return;
    }

    currentUser = data.user;

    await loadMember();
  });


  // ================================
  // LOAD MEMBER PROFILE
  // ================================

  async function loadMember() {

    const { data, error } = await supabaseClient
      .from("profiles")
      .select("id, full_name, member_id, role")
      .eq("id", currentUser.id)
      .single();

    if (error) {
      showStatus(
        loginStatus,
        "Your account is authenticated, but your member profile was not found.",
        "error"
      );

      await supabaseClient.auth.signOut();
      return;
    }

    currentProfile = data;

    welcome.textContent =
      "Welcome, " + currentProfile.full_name;

    loginCard.classList.add("hidden");
    chatCard.classList.remove("hidden");
    logoutBtn.classList.remove("hidden");

    await loadConversation();
  }


  // ================================
  // LOAD OR CREATE CONVERSATION
  // ================================

  async function loadConversation() {

    let { data, error } = await supabaseClient
      .from("conversations")
      .select("id, member_id")
      .eq("member_id", currentUser.id)
      .maybeSingle();

    if (error) {
      showStatus(
        chatStatus,
        error.message,
        "error"
      );
      return;
    }

    if (!data) {

      const result = await supabaseClient
        .from("conversations")
        .insert({
          member_id: currentUser.id
        })
        .select("id, member_id")
        .single();

      if (result.error) {
        showStatus(
          chatStatus,
          result.error.message,
          "error"
        );
        return;
      }

      data = result.data;
    }

    currentConversation = data;

    await loadMessages();
    subscribeToMessages();
  }


  // ================================
  // LOAD MESSAGES
  // ================================

  async function loadMessages() {

    const { data, error } = await supabaseClient
      .from("messages")
      .select("id, conversation_id, sender_id, body, created_at")
      .eq("conversation_id", currentConversation.id)
      .order("created_at", {
        ascending: true
      });

    if (error) {
      showStatus(
        chatStatus,
        error.message,
        "error"
      );
      return;
    }

    messagesBox.innerHTML = "";

    data.forEach(message => {
      displayMessage(message);
    });

    scrollMessages();
  }


  // ================================
  // DISPLAY MESSAGE
  // ================================

  function displayMessage(message) {

    const div = document.createElement("div");

    const mine =
      message.sender_id === currentUser.id;

    div.className =
      "message " + (mine ? "mine" : "admin");

    const body = document.createElement("div");
    body.textContent = message.body;

    const time = document.createElement("span");
    time.className = "time";

    time.textContent =
      new Date(message.created_at).toLocaleString();

    div.appendChild(body);
    div.appendChild(time);

    messagesBox.appendChild(div);
  }


  // ================================
  // SEND MESSAGE
  // ================================

  async function sendMessage() {

    const body = messageInput.value.trim();

    if (!body || !currentConversation) {
      return;
    }

    sendBtn.disabled = true;

    const { error } = await supabaseClient
      .from("messages")
      .insert({
        conversation_id: currentConversation.id,
        sender_id: currentUser.id,
        body
      });

    sendBtn.disabled = false;

    if (error) {

      showStatus(
        chatStatus,
        error.message,
        "error"
      );

      return;
    }

    messageInput.value = "";
  }


  sendBtn.addEventListener("click", sendMessage);


  messageInput.addEventListener("keydown", event => {

    if (event.key === "Enter") {
      event.preventDefault();
      sendMessage();
    }

  });


  // ================================
  // REALTIME MESSAGES
  // ================================

  function subscribeToMessages() {

    if (realtimeChannel) {
      supabaseClient.removeChannel(realtimeChannel);
    }

    realtimeChannel =
      supabaseClient
        .channel(
          "member-chat-" + currentConversation.id
        )
        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "messages",
            filter:
              "conversation_id=eq." +
              currentConversation.id
          },
          payload => {

            displayMessage(payload.new);
            scrollMessages();

          }
        )
        .subscribe();
  }


  // ================================
  // SCROLL CHAT
  // ================================

  function scrollMessages() {
    messagesBox.scrollTop =
      messagesBox.scrollHeight;
  }


  // ================================
  // LOGOUT
  // ================================

  logoutBtn.addEventListener("click", async () => {

    if (realtimeChannel) {
      await supabaseClient.removeChannel(
        realtimeChannel
      );
      realtimeChannel = null;
    }

    await supabaseClient.auth.signOut();

    currentUser = null;
    currentProfile = null;
    currentConversation = null;

    chatCard.classList.add("hidden");
    logoutBtn.classList.add("hidden");
    loginCard.classList.remove("hidden");

    emailInput.value = "";
    passwordInput.value = "";
    messagesBox.innerHTML = "";
  });


  // ================================
  // CHECK EXISTING LOGIN
  // ================================

  async function checkSession() {

    const { data } =
      await supabaseClient.auth.getSession();

    if (data.session) {

      currentUser = data.session.user;

      await loadMember();

    }
  }

  checkSession();

</script>

</body>
</html>

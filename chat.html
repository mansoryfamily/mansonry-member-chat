<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freemasonry Heritage | Member Messaging</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>
:root{--gold:#d4af37;--gold-dark:#b8941f;--dark:#07111f;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:var(--dark);color:white;min-height:100vh;padding-bottom:120px;}

/* BACKGROUND */
body::before{
content:"";
position:fixed;top:0;left:0;width:100%;height:100%;
background:linear-gradient(rgba(7,17,31,.88), rgba(7,17,31,.95)),url("1517026394531.jpeg");
background-size:cover;background-position:center;background-attachment:fixed;z-index:-2;
}
body::after{content:"◬";position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:400px;color:rgba(212,175,55,.03);z-index:-1;pointer-events:none;}

header{position:fixed;top:0;left:0;width:100%;padding:20px 8%;background:rgba(0,0,0,.8);backdrop-filter:blur(15px);display:flex;justify-content:space-between;align-items:center;z-index:1000;border-bottom:1px solid rgba(212,175,55,.2);}
.logo{font-size:28px;font-weight:700;color:var(--gold);font-family:'Playfair Display',serif;}
.logout{background:var(--gold);color:#111;padding:10px 25px;border-radius:30px;text-decoration:none;font-weight:600;transition:.3s;}
.logout:hover{background:var(--gold-dark);transform:translateY(-2px);}

.container{padding:120px 8% 50px;max-width:1000px;margin:auto;}
.page-header{text-align:center;margin-bottom:30px;}
.page-header .fraternity-name{font-size:16px;color:#ccc;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;}
.page-header h1{font-size:36px;color:var(--gold);font-family:'Playfair Display',serif;}

/* CHAT LAYOUT */
.chat-container {
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: 20px;
  background: rgba(11, 23, 40, 0.85);
  border: 1px solid rgba(212, 175, 55, 0.25);
  border-radius: 20px;
  backdrop-filter: blur(20px);
  height: 600px;
  overflow: hidden;
  box-shadow: 0 15px 40px rgba(0,0,0,.4);
}

/* User layout adjustment if single column */
.chat-container.user-view {
  grid-template-columns: 1fr;
}

/* MEMBER LIST (Admin only) */
.member-list {
  border-right: 1px solid rgba(212, 175, 55, 0.2);
  overflow-y: auto;
  padding: 15px;
}
.member-item {
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 8px;
  background: rgba(255,255,255,0.03);
  cursor: pointer;
  transition: 0.2s;
  border: 1px solid transparent;
}
.member-item:hover, .member-item.active {
  background: rgba(212, 175, 55, 0.15);
  border-color: var(--gold);
}
.member-name { font-weight: 600; color: #fff; font-size: 14px; }
.member-phone { font-size: 12px; color: #aaa; margin-top: 2px; }

/* CHAT BOX */
.chat-box {
  display: flex;
  flex-direction: column;
  height: 100%;
}
.chat-header {
  padding: 15px 20px;
  border-bottom: 1px solid rgba(212, 175, 55, 0.2);
  font-weight: 600;
  color: var(--gold);
  background: rgba(0,0,0,0.2);
}
.messages-area {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.message {
  max-width: 70%;
  padding: 10px 16px;
  border-radius: 15px;
  font-size: 14px;
  line-height: 1.4;
  word-break: break-word;
}
.message.sent {
  align-self: flex-end;
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color: #111;
  border-bottom-right-radius: 2px;
  font-weight: 500;
}
.message.received {
  align-self: flex-start;
  background: rgba(255,255,255,0.1);
  color: #fff;
  border-bottom-left-radius: 2px;
  border: 1px solid rgba(255,255,255,0.05);
}

/* CHAT INPUT */
.chat-input-area {
  padding: 15px;
  border-top: 1px solid rgba(212, 175, 55, 0.2);
  display: flex;
  gap: 10px;
  background: rgba(0,0,0,0.2);
}
.chat-input {
  flex: 1;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(212, 175, 55, 0.3);
  padding: 12px 18px;
  border-radius: 25px;
  color: #fff;
  outline: none;
}
.chat-input:focus { border-color: var(--gold); }
.send-btn {
  background: var(--gold);
  color: #111;
  border: none;
  padding: 0 25px;
  border-radius: 25px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}
.send-btn:hover { background: var(--gold-dark); }

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:rgba(15,26,46,.94);backdrop-filter:blur(25px);padding:10px;border-radius:22px;display:flex;gap:8px;border:1px solid rgba(212,175,55,.25);box-shadow:0 15px 40px rgba(0,0,0,.5);z-index:2000;max-width:calc(100% - 30px);}
.nav-item{width:80px;height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#a0b0c9;border-radius:16px;font-size:11px;font-weight:500;transition:.25s ease;}
.nav-icon{width:24px;height:24px;margin-bottom:5px;fill:currentColor;}
.nav-item:hover{background:rgba(212,175,55,.1);color:#f1ca52;transform:translateY(-2px);}
.nav-item.active{background:linear-gradient(135deg,#d4af37,#b8941f);color:#111;font-weight:600;box-shadow:0 6px 18px rgba(212,175,55,.35);}

@media(max-width:768px){
  .chat-container { grid-template-columns: 1fr; height: 500px; }
  .member-list { display: none; } /* Admin mobile sidebar toggle logic can be added */
  .member-list.show-mobile { display: block; }
}
</style>
</head>
<body>

<header>
<div class="logo">Freemasonry Heritage</div>
<a href="#" class="logout">Logout</a>
</header>

<main class="container">
<div class="page-header">
<div class="fraternity-name">Freemasonry Heritage Fraternity</div>
<h1>Private Administration Chat</h1>
</div>

<div class="chat-container user-view" id="chatContainer">
  <!-- Member List (Visible only to Admin) -->
  <div class="member-list" id="memberList" style="display: none;">
    <h4 style="color: var(--gold); margin-bottom: 12px; font-size: 14px;">Members Directory</h4>
    <div id="membersContainer"></div>
  </div>

  <!-- Chat Area -->
  <div class="chat-box">
    <div class="chat-header" id="chatHeader">Conversation with Administration</div>
    <div class="messages-area" id="messagesArea"></div>
    <form class="chat-input-area" id="chatForm">
      <input type="text" class="chat-input" id="messageInput" placeholder="Type a message..." required autocomplete="off">
      <button type="submit" class="send-btn">Send</button>
    </form>
  </div>
</div>

</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, push, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBSs3ekiR8vQ_1Ar5oZVBKGjuOQbwcgNEM",
  authDomain: "mansonry-family-fraternity.firebaseapp.com",
  databaseURL: "https://mansonry-family-fraternity-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "mansonry-family-fraternity",
  storageBucket: "mansonry-family-fraternity.firebasestorage.app",
  messagingSenderId: "964415179161",
  appId: "1:964415179161:web:c8fd1a777542932d7c6b08",
  measurementId: "G-Q8LC74ZFXN"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const database = getDatabase(app);

let currentUser = null;
let isAdmin = false;
let activeChatUserId = null;

const ADMIN_UID = "ADMIN_USER_ID_HERE"; // Put the specific Admin UID here if applicable

const chatContainer = document.getElementById('chatContainer');
const memberList = document.getElementById('memberList');
const membersContainer = document.getElementById('membersContainer');
const messagesArea = document.getElementById('messagesArea');
const chatForm = document.getElementById('chatForm');
const messageInput = document.getElementById('messageInput');
const chatHeader = document.getElementById('chatHeader');

onAuthStateChanged(auth, (user) => {
  if(!user){
    window.location.href = "login.html";
    return;
  }
  
  currentUser = user;

  // Check if current user is admin
  const roleRef = ref(database, `users/${user.uid}`);
  onValue(roleRef, (snapshot) => {
    const userData = snapshot.val();
    isAdmin = userData && (userData.role === "admin" || user.uid === ADMIN_UID);

    if (isAdmin) {
      chatContainer.classList.remove('user-view');
      memberList.style.display = 'block';
      loadMembers();
    } else {
      activeChatUserId = user.uid;
      loadMessages(user.uid);
    }
  });
});

// Load members for admin
function loadMembers() {
  const usersRef = ref(database, 'users');
  onValue(usersRef, (snapshot) => {
    membersContainer.innerHTML = '';
    snapshot.forEach((childSnapshot) => {
      const member = childSnapshot.val();
      const memberId = childSnapshot.key;

      if (member.role !== 'admin') {
        const item = document.createElement('div');
        item.className = `member-item ${activeChatUserId === memberId ? 'active' : ''}`;
        item.innerHTML = `
          <div class="member-name">${member.fullName || 'Member'}</div>
          <div class="member-phone">${member.phone || 'No Phone Number'}</div>
        `;
        item.onclick = () => {
          document.querySelectorAll('.member-item').forEach(el => el.classList.remove('active'));
          item.classList.add('active');
          activeChatUserId = memberId;
          chatHeader.innerText = `Chat with: ${member.fullName || 'Member'} (${member.phone || 'N/A'})`;
          loadMessages(memberId);
        };
        membersContainer.appendChild(item);
      }
    });
  });
}

// Load messages for specific user ID thread
function loadMessages(targetUserId) {
  const chatsRef = ref(database, `chats/${targetUserId}`);
  onValue(chatsRef, (snapshot) => {
    messagesArea.innerHTML = '';
    snapshot.forEach((childSnapshot) => {
      const msg = childSnapshot.val();
      const msgDiv = document.createElement('div');
      
      const isMe = msg.senderId === currentUser.uid;
      msgDiv.className = `message ${isMe ? 'sent' : 'received'}`;
      msgDiv.innerText = msg.text;
      
      messagesArea.appendChild(msgDiv);
    });
    messagesArea.scrollTop = messagesArea.scrollHeight;
  });
}

// Send Message
chatForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = messageInput.value.trim();
  if(!text || !activeChatUserId) return;

  const chatThreadRef = ref(database, `chats/${activeChatUserId}`);
  const newMsgRef = push(chatThreadRef);
  
  set(newMsgRef, {
    senderId: currentUser.uid,
    text: text,
    timestamp: Date.now()
  });

  messageInput.value = '';
});

// Logout
document.querySelector(".logout").addEventListener("click",(e)=>{
  e.preventDefault();
  signOut(auth).then(()=>{window.location.href="login.html";});
});
</script>

</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mansonry Family Administrator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h2 {
      margin: 0;
      font-size: 20px;
    }

    #logoutBtn {
      background: #c62828;
      color: white;
      border: none;
      padding: 9px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .dashboard {
      display: flex;
      height: calc(100vh - 64px);
    }

    .members {
      width: 32%;
      min-width: 220px;
      background: white;
      border-right: 1px solid #ddd;
      overflow-y: auto;
      padding: 15px;
    }

    .members h3 {
      margin-top: 0;
    }

    #memberList button {
      display: block;
      width: 100%;
      background: white;
      border: 1px solid #ddd;
      border-radius: 7px;
      margin-bottom: 8px;
      padding: 12px;
      cursor: pointer;
    }

    #memberList button:hover {
      background: #f0f0f0;
    }

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      background: white;
      padding: 15px;
      border-bottom: 1px solid #ddd;
    }

    .chat-header h3 {
      margin: 0;
    }

    #adminMessages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .welcome-message {
      text-align: center;
      color: #777;
      margin-top: 60px;
    }

    #adminMessageForm {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: white;
      border-top: 1px solid #ddd;
    }

    #adminMessage {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    #adminMessageForm button {
      padding: 12px 18px;
      background: #198754;
      color: white;
      border: none;
      border-radius: 7px;
      cursor: pointer;
    }

    @media (max-width: 700px) {

      .dashboard {
        flex-direction: column;
        height: calc(100vh - 64px);
      }

      .members {
        width: 100%;
        min-width: 0;
        height: 35%;
        border-right: none;
        border-bottom: 1px solid #ddd;
      }

      .chat {
        height: 65%;
      }

      header h2 {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h2>Mansonry Family Administrator</h2>

    <button id="logoutBtn" onclick="adminLogout()">
      Logout
    </button>
  </header>

  <div class="dashboard">

    <aside class="members">

      <h3>Members</h3>

      <div id="memberList">
        <p>Loading members...</p>
      </div>

    </aside>


    <main class="chat">

      <div class="chat-header">

        <h3 id="selectedMember">
          Select a member
        </h3>

      </div>


      <div id="adminMessages">

        <div class="welcome-message">

          <p>
            Select a member to view their private conversation.
          </p>

        </div>

      </div>


      <form
        id="adminMessageForm"
        onsubmit="sendAdminMessage(event)"
      >

        <input
          id="adminMessage"
          type="text"
          placeholder="Type your reply..."
          autocomplete="off"
          maxlength="4000"
        >

        <button type="submit">
          Send
        </button>

      </form>

    </main>

  </div>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Administrator JavaScript -->
  <script src="admin.js"></script>

</body>
</html>
